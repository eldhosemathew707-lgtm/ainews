name: Refresh AI News
on:
  schedule:
    - cron: '0 */12 * * *' # Updates every 12 hours
  workflow_dispatch:      # Allows you to click a button to update manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Scrape
        run: python scrape.py
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "Update news feed" || exit 0
          git push
